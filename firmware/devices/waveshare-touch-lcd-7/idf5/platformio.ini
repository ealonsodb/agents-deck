; waveshare-touch-lcd-7 on arduino-esp32 3.x / ESP-IDF 5 (pioarduino): the firmware to flash.
; The same sources as the main build (../platformio.ini, arduino-esp32 2.0.17,
; USB only), plus Wi-Fi to the deck over TLS 1.3. The RGB panel scans out of a
; bounce buffer in internal RAM (LCD7_BOUNCE_PX pixels: 10 lines), refilled from
; the PSRAM frame, and its DMA restarts at every vsync: without them the picture
; drifts and loses its top rows whenever the CPU or Wi-Fi is busy with PSRAM
; (as Waveshare's BSP for this board does).
;
;   pio run -d firmware/devices/waveshare-touch-lcd-7/idf5 -e idf5 -t upload
;   pio run -d firmware/devices/waveshare-touch-lcd-7/idf5 -e idf5-debug -t upload
;
; pioarduino and PlatformIO's own espressif32 platform share package names
; (framework-arduinoespressif32) and clash in one PlatformIO home, so this
; project keeps its platform and toolchains in a home of its own.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the port marked UART (the board's CH343 on UART0), not the chip's own USB.
; DTR/RTS drive the auto-reset there: leave them alone or the board resets.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; Wi-Fi to the deck needs TLS 1.3 (the deck's network listener accepts nothing
; else), which the prebuilt arduino-esp32 libraries leave out: pioarduino
; rebuilds them with it (its first build takes a while longer).
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
build_flags =
    ; Serial is UART0 (the port marked UART), 115200 baud
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -DLCD7_BOUNCE_PX=8000
build_src_flags = -Wall -Wextra
; Arduino_GFX 1.5.0 doesn't build on arduino-esp32 3.3 (its hardware SPI
; buses); 1.6 does.
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9

; The firmware with one-line notes on the USB port (link, Wi-Fi, memory; the deck ignores text).
[env:idf5-debug]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DPANEL_DEBUG
