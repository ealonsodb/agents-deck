; Waveshare ESP32-S3-Touch-LCD-7 (800x480 ST7262 RGB, GT911 touch): the deck as a 4x4 grid, over Deck Link (the UART port)
[platformio]
default_envs = waveshare-touch-lcd-7

[env:waveshare-touch-lcd-7]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the port marked UART (the board's CH343 on UART0), not the chip's own USB.
; DTR/RTS drive the auto-reset there: leave them alone or the board resets.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ; Serial is UART0 (the port marked UART), 115200 baud
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

; Bring-up: the same firmware with one-line notes on the USB port (the deck ignores text).
[env:debug]
extends = env:waveshare-touch-lcd-7
build_flags = ${env:waveshare-touch-lcd-7.build_flags} -DPANEL_DEBUG
